<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="352" viewBox="0 0 1120 352" role="img" aria-labelledby="title desc">
<title id="title">A shelf of skills. A place to start.</title>
<desc id="desc">Learn with guided reading and practice. Understand code with maps and diagrams. Think through ideas and choose your next step.</desc>
<rect width="1120" height="352" rx="24" fill="#f5f3ee"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="40" y="50" fill="#64716e" font-size="12" font-weight="700" letter-spacing="2">YOUR NEXT QUESTION, A GOOD PLACE TO START</text>
<text x="40" y="94" fill="#193d37" font-size="32" font-weight="700">What would you like to work on?</text>
<g transform="translate(40 124)">
<rect width="336" height="182" rx="16" fill="#e0ece6"/>
<rect x="20" y="20" width="38" height="38" rx="10" fill="#2f6655"/>
<path d="M29 30h7c3 0 3 2 3 2s0-2 3-2h7v18h-7c-3 0-3 2-3 2s0-2-3-2h-7z M39 32v18" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/>
<text x="20" y="87" fill="#193d37" font-size="23" font-weight="700">Learn something new</text>
<text x="20" y="115" fill="#36584e" font-size="15">Read together. Practise a language.</text>
<text x="20" y="138" fill="#36584e" font-size="15">Learn by explaining what you know.</text>
<text x="20" y="164" fill="#2f6655" font-size="12" font-weight="700">READ · DISCUSS · PRACTISE</text>
</g>
<g transform="translate(392 124)">
<rect width="336" height="182" rx="16" fill="#e2e9f3"/>
<rect x="20" y="20" width="38" height="38" rx="10" fill="#415e88"/>
<path d="m34 32-7 7 7 7m10-14 7 7-7 7m-3-17-4 20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="20" y="87" fill="#263e60" font-size="23" font-weight="700">Understand your code</text>
<text x="20" y="115" fill="#425a78" font-size="15">Find your way around a project.</text>
<text x="20" y="138" fill="#425a78" font-size="15">See what runs, how, and why.</text>
<text x="20" y="164" fill="#415e88" font-size="12" font-weight="700">TRACE · MAP · EXPLAIN</text>
</g>
<g transform="translate(744 124)">
<rect width="336" height="182" rx="16" fill="#f1e5d6"/>
<rect x="20" y="20" width="38" height="38" rx="10" fill="#8a623d"/>
<path d="M34 44c0-4-5-5-5-11a10 10 0 0 1 20 0c0 6-5 7-5 11zm1 4h8m-7 4h6" transform="translate(0 3) scale(1 .9)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="20" y="87" fill="#64462d" font-size="23" font-weight="700">Think an idea through</text>
<text x="20" y="115" fill="#795b40" font-size="15">Explore options. Test assumptions.</text>
<text x="20" y="138" fill="#795b40" font-size="15">Choose a useful next step.</text>
<text x="20" y="164" fill="#8a623d" font-size="12" font-weight="700">EXPLORE · QUESTION · DECIDE</text>
</g>
</g>
</svg>
