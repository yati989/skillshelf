[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skillshelf-learning-runtime"
version = "0.1.0"
description = "Prepare per-subject evidence bases and orchestrate source-grounded learning."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
pdf = ["pymupdf4llm>=0.0.17"]
difficult-pdf = ["docling>=2.0; python_version >= '3.10'"]

[project.scripts]
kb-tutor = "knowledge_base.cli:main"
kb-read = "knowledge_base.reading_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
